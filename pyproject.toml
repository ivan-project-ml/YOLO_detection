[project]
name = "yolo-detect"
version = "0.1.0"
description = "My first CV project"
readme = "README.md"
authors = [
    { name = "Ivan Karimov", email = "karimovivan70@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.149.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
yolo-detect = "yolo_detect:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"
